name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 门禁脚本沿第一父链回溯最近绿灯 commit，需要完整历史
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Verify successful main CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/verify_release_ci_gate.py
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          tree = ast.parse(pathlib.Path('src/docvortex/version.py').read_text())
          version = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets))
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag does not match package version')
          PY
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - run: uv venv
      - name: Install built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -type f -name 'docvortex-*.whl' -print -quit)"
          test -n "$wheel"
          uv pip install "$wheel"
      - run: uv run --no-project docvortex --version
      - name: Verify installed package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --no-project python tools/verify_release_package.py tests/unittest/pdfs/test.pdf

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/docvortex/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
